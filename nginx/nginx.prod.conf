worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    upstream backend_upstream {
        server backend:8000;
    }

    # --- Plain HTTP: only the ACME challenge + redirect to HTTPS ---------------
    server {
        listen 80;
        server_name YOUR_DOMAIN_HERE;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- HTTPS: everything else -------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name YOUR_DOMAIN_HERE;

        ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN_HERE/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN_HERE/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # HSTS: only meaningful once you're confident HTTPS is staying up —
        # browsers cache this and won't fall back to HTTP even if the cert
        # setup temporarily breaks. Fine to enable from day one for a fresh
        # domain like this one, but worth knowing what it does.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        root /usr/share/nginx/html;
        index index.html;

        # WebRTC signaling relay (Devices module) — needs the Upgrade/Connection
        # headers the generic /api/ location below doesn't set.
        location ~ ^/api/v1/devices/sessions/[^/]+/signal$ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # /t/{code}/gate and /t/not-found are SPA pages (React Router) — serve
        # index.html and let the client-side router take over, same as any
        # other frontend route.
        location = /t/not-found {
            try_files /index.html =404;
        }

        location ~ ^/t/[^/]+/gate$ {
            try_files /index.html =404;
        }

        # Short tracking links live at /t/{code} (bare, no further path
        # segments) on the backend.
        location ~ ^/t/[^/]+$ {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # User-uploaded files (avatars, QR logos) served by the backend's
        # StaticFiles mount.
        location /uploads/ {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://backend_upstream;
        }

        # The built SPA — everything not matched above.
        location / {
            try_files $uri /index.html;
        }
    }
}
