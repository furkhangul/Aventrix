worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 10m;

    # Basic security headers applied to every response proxied through nginx.
    # (The backend also sets these itself so the API is safe even when hit
    # directly, but we keep them here too for the unified origin.)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    upstream backend_upstream {
        server backend:8000;
    }

    upstream frontend_upstream {
        server frontend:5173;
    }

    server {
        listen 80;
        server_name _;

        # NOTE: in production, terminate TLS here (or upstream of this proxy)
        # and add a separate `server { listen 80; return 301 https://$host$request_uri; }`
        # block. See docs/DEPLOYMENT.md.

        # WebRTC signaling relay (Devices module) — needs the Upgrade/Connection
        # headers the generic /api/ location below doesn't set, since HTTP
        # proxying doesn't imply WebSocket proxying. A matching regex location
        # takes precedence over the plain-prefix /api/ block below regardless
        # of declaration order, so this doesn't need to appear first, but it's
        # kept here for readability.
        location ~ ^/api/v1/devices/sessions/[^/]+/signal$ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Long-lived control sessions shouldn't be killed by nginx's
            # default proxy read timeout.
            proxy_read_timeout 3600s;
        }

        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # /t/{code}/gate and /t/not-found are SPA pages (React Router),
        # not backend routes — must reach the frontend, not the backend.
        # Matched before the bare-code regex below since exact/regex
        # locations here are mutually exclusive by path shape anyway, but
        # keeping them first documents the intent.
        location = /t/not-found {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location ~ ^/t/[^/]+/gate$ {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Short tracking links live at /t/{code} (bare, no further path
        # segments) on the backend.
        location ~ ^/t/[^/]+$ {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # User-uploaded files (avatars, QR logos) served by the backend's
        # StaticFiles mount — without this, avatar_url/logo URLs 404 through
        # the unified origin since they'd otherwise fall through to the SPA.
        location /uploads/ {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://backend_upstream;
        }

        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
